# GitActionFlow — local development
#
# Usage:
#   docker compose up -d postgres          # database only (typical for local Go run)
#   docker compose up -d --build           # postgres + backend container
#   docker compose down

services:
  postgres:
    image: postgres:16-alpine
    container_name: gitactionflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitactionflow
      POSTGRES_PASSWORD: gitactionflow
      POSTGRES_DB: gitactionflow
    ports:
      - "5432:5432"
    volumes:
      - gitactionflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitactionflow -d gitactionflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gitactionflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      LOG_LEVEL: info
      AUTO_MIGRATE: "true"
      # Host "postgres" is the compose service name (not localhost).
      DATABASE_URL: postgres://gitactionflow:gitactionflow@postgres:5432/gitactionflow?sslmode=disable
      FRONTEND_URL: http://localhost:5173
      # Provide real values via a local .env file or overrides — placeholders will not complete OAuth.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-replace_me}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-replace_me}
      GITHUB_OAUTH_REDIRECT_URL: http://localhost:8080/auth/github/callback
      SESSION_SECRET: ${SESSION_SECRET:-0123456789abcdef0123456789abcdef}
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: Lax
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  gitactionflow_pgdata:
